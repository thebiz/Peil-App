name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|> " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Peil-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Peil-APK
          path: Peil-v${{ github.run_number }}.apk

      # Release für den Updater in der App (und zum direkten Herunterladen)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Peil v${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Peil-v${{ github.run_number }}.apk
          make_latest: true
