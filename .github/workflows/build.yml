name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|^> [^T]|^  [^ ]" build.log | grep -v "^> Task" | head -10 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Version lesen
        run: echo "PEIL_VERSION=$(cat version.txt | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Änderungen aus dem Versionsverlauf lesen
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("app/src/main/assets/changelog.json", encoding="utf-8"))[0]
          v = open("version.txt").read().strip()
          # Jede Version braucht einen Eintrag im Versionsverlauf
          assert r["version"] == v, f"changelog.json fehlt ein Eintrag für {v} (oben steht {r['version']})"
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join("– " + c for c in r["changes"]) + "\n")
          PY

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Peil-${{ env.PEIL_VERSION }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Peil-APK
          path: Peil-${{ env.PEIL_VERSION }}.apk

      # Release für den Updater in der App (und zum direkten Herunterladen)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Peil ${{ env.PEIL_VERSION }}
          body_path: release_notes.md
          files: Peil-${{ env.PEIL_VERSION }}.apk
          make_latest: true
